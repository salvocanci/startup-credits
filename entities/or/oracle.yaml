    offer_slug_aliases: []
    title: OCI Universal Credits for Startups
    summary: Selected participants may receive USD 5,000 to USD 60,000 in Universal Credits exclusively for use on OCI for twelve months, subject to Oracle selection and program terms.
    lifecycle:
      status: active
      effective_from: 2026-10-16T11:35:00.000Z
    economics:
      consideration:
        kind: none
      benefits:
        - benefit_id: ben_01
          description: Universal Credits exclusively for use on OCI ranging from USD 5,000 to USD 60,000; available for twelve months from the date they are made available; unused credits expire with no cash value.
          kind: credit
          duration:
            kind: exact
            value: P1Y
          value:
            kind: range
            minimum:
              currency: USD
              minor_units: 500000
            maximum:
              currency: USD
              minor_units: 6000000
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            kind: manual
            reason: vendor-discretion
            statement: Legally registered technology companies that develop digital products or platforms with the potential for scalable use of OCI.
          - criterion_id: cri_02
            kind: manual
            reason: vendor-discretion
            statement: Must operate as a technology company, intend to deploy eligible workloads on OCI, provide complete and accurate application information, and have authority to accept the Terms and Conditions.
          - criterion_id: cri_03
            kind: manual
            reason: vendor-discretion
            statement: Offered solely to business entities in countries or territories designated by Oracle; Oracle selects participants at its sole discretion and subject to Program availability.
          - criterion_id: cri_04
            kind: manual
            reason: vendor-discretion
            statement: Public entities are not eligible. Applicants that present regulatory, financial-crime, sanctions, or reputational risks are not eligible.
