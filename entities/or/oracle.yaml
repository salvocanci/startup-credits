    offer_slug: oracle-startup-growth-engine-oci-credits
    offer_slug_aliases: []
    title: OCI Universal Credits for Startups
    summary: Selected participants may receive USD 5,000 to USD 60,000 in OCI Universal Credits for twelve months, subject to Oracle selection and program terms.
    lifecycle:
      status: active
      effective_from: 2026-10-16T11:35:00.000Z
    economics:
      consideration:
        kind: none
      benefits:
        - benefit_id: ben_01
          description: Universal Credits exclusively for use on Oracle Cloud Infrastructure (OCI), ranging from USD 5,000 to USD 60,000; available for twelve months from the date they are made available, then unused credits expire with no cash value.
          kind: credit
          duration:
            kind: exact
            value: P1Y
          value:
            kind: range
            minimum:
              currency: USD
              minor_units: 500000
            maximum:
              currency: USD
              minor_units: 6000000
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            kind: manual
            reason: vendor-discretion
            statement: Legally registered technology company that develops digital products or platforms with the potential for scalable use of OCI, and intends to deploy eligible workloads on OCI.
          - criterion_id: cri_02
            kind: manual
            reason: vendor-discretion
            statement: Business entity in a country or territory designated by Oracle for the Program; Oracle selects participants at its sole discretion and subject to Program availability.
          - criterion_id: cri_03
            kind: manual
            reason: vendor-discretion
            statement: Applicant must provide complete and accurate information during the application process and have authority to accept the Program terms on behalf of the applicant.
          - kind: not
            rule:
              criterion_id: cri_04
              kind: manual
              reason: vendor-discretion
              statement: Public entities, as defined by applicable law and Oracle policy, are not eligible; applicants that present regulatory, financial-crime, sanctions, or reputational risks are not eligible.
